; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = d1_mini_debug

[common]
	framework = arduino
	upload_speed = 460800
	monitor_speed = 115200
	build_flags =
		-Wno-unknown-pragmas
		-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
		; enabled by instruction above
		; -fexceptions					; We are using execptions inside
		-D TEMPLATE_PLACEHOLDER=36      ; $ sign
		'-D WIFI_DEFAULT_AP_SSID_PREFIX="LSC"'	; Default
		'-D DEFAULT_DEVICE_NAME="LSC-Device"'   ; Default Device Name
		; WiFi PHY mode default (n/g/b) - can be changed in the config ("wifi.phymode"),
		; i.e. 802.11g reduces SDK rate table changes on ESP8266:
		;   '-D WIFI_DEFAULT_PHY_MODE="g"'
		; ESP8266 NONOS SDK: default of the core (2.2.x). Newer SDK, if needed:
		;   -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305

	board_build.ldscript = eagle.flash.4m1m.ld

	; Only external libraries - framework libraries (LittleFS, ESP8266WiFi, ...)
	; are found by the library dependency finder from the includes.
	; PLibESPV1 is in lib/ (git submodule) and found automatically.
	; ArduinoJson is not needed (PLibESPV1 uses JsonNode).
	; Versions are pinned - tested combination:
	;   ESPAsyncTCP 2.0.0        - scripts/patchLibs.py patches this version (abort use-after-free)
	;   ESPAsyncWebServer 3.10.0 - contains the WebSocket defragmentation fix (406147f, issue #382)
	;                              3.12.x makes the request constructor private (used in CWebServer.cpp)
	lib_deps =
		ESP32Async/ESPAsyncTCP @ 2.0.0
		ESP32Async/ESPAsyncWebServer @ 3.10.0
		marvinroger/AsyncMqttClient @ 0.9.0

	; Released ESP8266 Arduino core 3.1.2 (PlatformIO package version 3.30102.0).
	; Development version, if needed:
	;   platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git
	platform_packages =
		platformio/framework-arduinoespressif8266 @ 3.30102.0

	; patchLibs.py (pre): fixes bugs in downloaded libraries (ESPAsyncTCP abort use-after-free)
	; buildSteps.py: increment version and store binary
	extra_scripts =
		pre:scripts/patchLibs.py
		scripts/buildSteps.py

[env:d1_mini_debug]
	framework = ${common.framework}
	platform = espressif8266
	board = d1_mini
	board_build.ldscript = eagle.flash.4m1m.ld
	platform_packages = ${common.platform_packages}
	monitor_filters 	 = esp8266_exception_decoder  ; Enable stack trace decoding
						   log2file					  ; Writes log to “logs/device-monitor-%date%.log”

	build_type = debug
	build_flags =
		${common.build_flags}
		-D TRACE
		-D DEBUGVERSION					; Defines, that this is a debugversion
		-D DEBUGINFOS					; Main Debug Info to enable Debug Macros
		-D NO_DEBUG_LSC_FILESYSTEM
		-D NO_DEBUG_LSC_SECURITY
		-D NO_DEBUG_LSC_APPL
		-D NO_DEBUG_LSC_WIFI
		-D NO_DEBUG_LSC_STATUSHANDLER
		-D NO_DEBUG_LSC_HTLM_PAGES
		-D NO_DEBUG_LSC_BUTTON
		-D NO_DEBUG_LSC_WEBSERVER
		-D NO_DEBUG_LSC_WEBROUTES
		-D NO_DEBUG_LSC_WEBSOCKET
		-D NO_DEBUG_LSC_MQTT
		-D NO_DEBUG_LSC_ONAIRLIGHT
		-D NO_DEBUG_LSC_RF433RECEIVER
		-D NO_DEBUG_LSC_DEW_SWITCH
		-D NO_DEBUG_LSC_DEW_SENSOR
		-D NO_DEBUG_LSC_DEW_FAN
		-D NO_DEBUG_LSC_DISPLAY
		-D NO_DEBUG_LSC_DISPLAY_PAGES
		-D NO_DEBUG_LSC_FRONTEND			; Debug the Frontend (WebGUI)

	lib_compat_mode = strict
	lib_ldf_mode = chain
	lib_deps =
		${common.lib_deps}
	board_build.filesystem = littlefs

	upload_speed = ${common.upload_speed}
	monitor_speed = ${common.monitor_speed}
	extra_scripts = ${common.extra_scripts}

[env:d1_mini]
	framework = ${common.framework}
	platform = espressif8266
	board = d1_mini
	board_build.ldscript = eagle.flash.4m1m.ld
	platform_packages = ${common.platform_packages}
	monitor_filters = log2file
	build_type = release
	build_flags =
		${common.build_flags}

	lib_compat_mode = strict
	lib_ldf_mode = chain
	lib_deps =
		${common.lib_deps}

	board_build.filesystem = littlefs
	upload_speed = ${common.upload_speed}
	monitor_speed = ${common.monitor_speed}
	extra_scripts = ${common.extra_scripts}
