<div id="InfoPage" >
     <!-- Status of $(prog_name) Ver.: $(prog_ver) -->
    <legend data-i18n="Info.legend"></legend>

    <div class="row">
        <!-- Actual consuming -->
        <div class="col-xs-12 col-md-6">
            <div class="chartCard">
                <div id="chartCurrent" class="chartBox">
                    <canvas class="chartCanvas"></canvas>
                    <div class="chartText">
                        <span class="chartNumber" data-cfg="gascounter_m3hCurrent">0</span><span class="chartMetric"> m³</span>
                    </div>
                    <div class="chartLabel" data-i18n="Info.m3hCurrent"></div>
                </div>
            </div>
        </div>
        <!-- Last hour consuming -->
        <div class="col-xs-12 col-md-6">
            <div class="chartCard">
                <div id="chartLastHour" class="chartBox">
                    <canvas class="chartCanvas"></canvas>
                    <div class="chartText">
                        <span class="chartNumber" data-cfg="gascounter_m3hLastHour">0</span><span class="chartMetric"> m³</span>
                    </div>
                    <div class="chartLabel" data-i18n="Info.m3hLastHour"></div>
                </div>
            </div>
        </div>
        <!-- Today consuming -->
        <div class="col-xs-12 col-md-6">
            <div class="chartCard">
                <div id="chartToday" class="chartBox">
                    <canvas class="chartCanvas"></canvas>
                    <div class="chartText">
                        <span class="chartNumber" data-cfg="gascounter_m3hToday">0</span><span class="chartMetric"> m³</span>
                    </div>
                    <div class="chartLabel" data-i18n="Info.m3hToday"></div>
                </div>
            </div>
        </div>
         <!-- Yesterday consuming -->
        <div class="col-xs-12 col-md-6">
            <div class="chartCard">
                <div id="chartPrevday" class="chartBox">
                    <canvas class="chartCanvas"></canvas>
                    <div class="chartText">
                        <span class="chartNumber" data-cfg="gascounter_m3hPrevday">0</span><span class="chartMetric"> m³</span>
                    </div>
                    <div class="chartLabel" data-i18n="Info.m3hPrevday"></div>
                </div>
            </div>
        </div>
        <!-- Total consumed (counter reading) - no chart -->
        <div class="col-xs-12">
            <div class="chartCard">
                <div class="chartBox">
                    <div class="chartText">
                        <span class="chartNumber" data-cfg="gascounter_m3hTotal">0</span><span class="chartMetric"> m³</span>
                    </div>
                    <div class="chartLabel" data-i18n="Info.m3hTotal"></div>
                </div>
            </div>
        </div>
        <!-- Current meter reading of the gas meter - no chart -->
        <div class="col-xs-12">
            <div class="chartCard">
                <div class="chartBox">
                    <div class="chartText">
                        <span class="chartNumber" data-cfg="gascounter_MeterReading">-</span><span class="chartMetric"> m³</span>
                    </div>
                    <div class="chartLabel" data-i18n="Info.MeterReading"></div>
                </div>
            </div>
        </div>
    </div>
</div>
