<!doctype html>
<!--
https://www.youtube.com/watch?v=J5pATVxrN8U

-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Getting Started with Chart JS with www.chartjs3.com</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      .chartMenu {
        width: 100vw;
        height: 40px;
        background: #1A1A1A;
        color: rgba(54, 162, 235, 1);
      }
      .chartMenu p {
        padding: 10px;
        font-size: 20px;
      }
      .chartCard {
        width: 100vw;
        height: calc(100vh - 40px);
        background: rgba(54, 162, 235, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chartBox {
        width: 700px;
        padding: 20px;
        border-radius: 20px;
        border: solid 3px rgba(54, 162, 235, 1);
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="chartMenu">
      <p>WWW.CHARTJS3.COM (Chart JS <span id="chartVersion"></span>)</p>
    </div>
    <div class="chartCard">
      <div class="chartBox">
        <canvas id="myChart"></canvas>
      </div>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
    <script>

      // https://www.youtube.com/watch?v=kOZH_xiczb8
      
      const chartWidth = document.querySelector('.chartBox').getBoundingClientRect().width - 40;
      console.log(chartWidth);
      const ctx = document.getElementById('myChart').getContext('2d');
      const gradientSegment = ctx.createLinearGradient(0,0,chartWidth,0);
      gradientSegment.addColorStop(0,'green');
      gradientSegment.addColorStop(0.2,'yellow');
      gradientSegment.addColorStop(1,'red');

    // setup 
    const data = {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
      datasets: [{
        label: 'Weekly Sales',
        data: [8],
        backgroundColor: [
          gradientSegment,
          'rgba(0, 0, 0, 0.2)'
        ],
        borderColor: [
          gradientSegment,
          'rgba(0, 0, 0, 0.2)'
        ],
        borderWidth: 1,
        circumference: 180,
        rotation: 270,
        cutout: '80%',
        needleValue : 7 // Value to be set for the needle (!)
      }]
    };

    const gaugeNeedle = {
        id: 'gaugeNeedle',
        afterDatasetDraw(chart, args, plugins) {
            const { ctx, data } = chart;
            ctx.save();
            console.log(chart.getDatasetMeta(0).data);
            const xCenter = chart.getDatasetMeta(0).data[0].x;
            const yCenter = chart.getDatasetMeta(0).data[0].y;
            const outerRadius = chart.getDatasetMeta(0).data[0].outerRadius;
            const innerRadius = chart.getDatasetMeta(0).data[0].innerRadius;
            const barWidth = outerRadius - innerRadius;
            const middleBar = (outerRadius - innerRadius) / 2;
            const radius = 15;
            const angle = Math.PI / 180;

            // https://www.youtube.com/watch?v=hlRMMooNxGM
            const needleValue = data.datasets[0].needleValue;
            const dataTotal = data.datasets[0].data.reduce((a,b) => a + b, 0);
            // View the calulated total chart data and the segments of the arc
            console.log("Total value of chart data : " + dataTotal);
            console.log(chart.getDatasetMeta(0).data[0]);
            
            const circumference = 
                (
                    (chart.getDatasetMeta(0).data[0].circumference / Math.PI) /
                    data.datasets[0].data[0]
                ) * needleValue;


            // Draw the pointer
            /*
            ctx.moveTo(xCenter,yCenter);
            ctx.lineTo(xCenter,yCenter - outerRadius),
            ctx.stroke();
            */
           ctx.translate(xCenter,yCenter);
           ctx.rotate(Math.PI * (circumference + 1.5));
           ctx.beginPath();
           ctx.lineWidth = 1;
           ctx.strokeStyle = 'grey';
           ctx.fillStyle = 'grey';
           ctx.moveTo(0 - radius,0);
           ctx.lineTo(0,- innerRadius - middleBar); 
           ctx.lineTo(0 + radius,0);
           ctx.closePath();
           ctx.stroke();
           ctx.fill();
        
           // Draw the closing arc
           ctx.beginPath();
           ctx.arc(0,0,radius,0,angle *360,false)
           ctx.fill();

           ctx.restore();


        }
    }

    const gaugeFlowMeter = {
        // see also : https://www.youtube.com/watch?v=QWo6E2zCwGw
        id: 'gaugeFlowMeter',
        afterDatasetDraw(chart, args, plugins) {
            const { ctx, data } = chart;
            ctx.save();

            const needleValue = data.datasets[0].needleValue;
            const xCenter = chart.getDatasetMeta(0).data[0].x;
            const yCenter = chart.getDatasetMeta(0).data[0].y;

            const circumference = 
                (
                    (chart.getDatasetMeta(0).data[0].circumference / Math.PI) /
                    data.datasets[0].data[0]
                ) * needleValue;
            const percentageValue = circumference * 100;

            // flowMeter
            ctx.font = 'bold 30px sans-serif';
            ctx.fillStyle = 'grey';
            ctx.textAlign = 'center';
            ctx.fillText(`${percentageValue.toFixed(2)}%`,xCenter,yCenter + 45);
            ctx.restore();
        }

    }

    const gaugeLabel = {
        id: 'gaugeLabel',
        afterDatasetDraw(chart, args, plugins) {
            const { ctx, chartArea: { left, right } } = chart;
            const xCenter = chart.getDatasetMeta(0).data[0].x;
            const yCenter = chart.getDatasetMeta(0).data[0].y;

            const outerRadius = chart.getDatasetMeta(0).data[0].outerRadius;
            const innerRadius = chart.getDatasetMeta(0).data[0].innerRadius;
            const barCenter = (outerRadius - innerRadius) / 2;

            ctx.save();
            ctx.translate(xCenter,yCenter);
            ctx.font = 'bold 15px sans-serif';
            ctx.fillStyle = 'black';
            ctx.textAlign = 'center';
            ctx.fillText(`Danger`,0 - innerRadius - barCenter , 0 +20);
            ctx.fillText(`Success`,0 + innerRadius + barCenter, 0 +20);
            
            ctx.restore();
        }
    }

    // config 
    const config = {
      type: 'doughnut',
      data,
      options: {
        layout: {
            padding: {
                bottom: 50
            }
        },
        aspectRatio: 1.8,
        plugins: {
            legend: {
                display: false
            },
            tooltip: {
                enabled: false
            }
        }
      },
      plugins: [gaugeNeedle, gaugeFlowMeter, gaugeLabel]
    };

    // render init block
    const myChart = new Chart(
      document.getElementById('myChart'),
      config
    );

    // Instantly assign Chart.js version
    const chartVersion = document.getElementById('chartVersion');
    chartVersion.innerText = Chart.version;
    </script>

  </body>
</html>
